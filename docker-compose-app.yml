networks:
  kafka-internal:
    external: true

services:
  # Потребитель событий из Kafka (users + orders)
  consumer:
    image: python:3.12-slim
    container_name: consumer
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./consumer.py:/app/consumer.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
    command: >
      bash -c "
        pip install --no-cache-dir -r requirements.txt &&
        python consumer.py
      "
    environment:
      # Список брокеров для подключения внутри сети kafka-internal
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      # Топики для подписки
      KAFKA_TOPICS: "dbserver1.public.users,dbserver1.public.orders"
      # Группа потребителей 
      CONSUMER_GROUP: "demo-consumer-group"
      # Логирование
      LOG_LEVEL: "INFO"
    networks:
      - kafka-internal